<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychology Island｜心理學探索島</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f8f1e8;
    color: #66554e;
    font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    text-align: center;
  }

  header {
    padding: 26px 15px 18px;
  }

  h1 {
    margin: 5px 0;
    font-size: clamp(25px, 5vw, 40px);
  }

  header p {
    font-size: 14px;
    line-height: 1.8;
  }

  .game-wrap {
    width: min(1100px, 96%);
    margin: auto;
    position: relative;
    border: 8px solid #fffaf3;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 12px 35px #77645630;
    background: #c7e6e5;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    background: #fffaf0ed;
    border-radius: 30px;
    padding: 11px 20px;
    font-size: 14px;
    white-space: nowrap;
    box-shadow: 0 4px 12px #66554e22;
  }

  .instructions {
    margin: 20px auto;
    line-height: 1.9;
    font-size: 14px;
  }

  .badges {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 18px auto 35px;
  }

  .badge {
    padding: 12px 18px;
    border-radius: 16px;
    background: #e8ded5;
    opacity: .5;
  }

  .badge.done {
    background: #d6ead6;
    opacity: 1;
  }

  .controls {
    display: none;
    margin: 18px auto;
    width: 180px;
    grid-template-columns: repeat(3, 55px);
    gap: 5px;
  }

  .controls button {
    width: 55px;
    height: 55px;
    border: none;
    border-radius: 14px;
    background: #e7cfc1;
    color: #66554e;
    font-size: 23px;
    touch-action: none;
  }

  .controls .up { grid-column: 2; }
  .controls .left { grid-column: 1; grid-row: 2; }
  .controls .down { grid-column: 2; grid-row: 2; }
  .controls .right { grid-column: 3; grid-row: 2; }

  .enter-btn {
    display: none;
    margin: 10px auto 25px;
    padding: 13px 25px;
    border: none;
    border-radius: 25px;
    background: #a9cdb4;
    color: #405b4a;
    font-size: 16px;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #342b2a99;
    padding: 20px;
    align-items: center;
    justify-content: center;
  }

  .modal.active { display: flex; }

  .modal-box {
    width: min(600px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #fffaf3;
    border-radius: 25px;
    padding: 28px 20px;
    position: relative;
    line-height: 1.9;
  }

  .close {
    position: absolute;
    top: 8px;
    right: 15px;
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
  }

  .choice, .primary {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    margin: 6px;
    cursor: pointer;
    font: inherit;
  }

  .choice { background: #f0dfd2; }
  .primary { background: #b5d6ba; }

  .result {
    margin-top: 18px;
    padding: 16px;
    border-radius: 16px;
    background: #e9f2e6;
    text-align: left;
  }

  footer {
    padding: 25px;
    font-size: 12px;
    color: #9c8980;
  }

  @media (max-width: 750px) {
    .controls { display: grid; }
    .enter-btn { display: block; }
    .hint { font-size: 12px; padding: 8px 12px; }
  }
</style>
</head>

<body>

<header>
  <div>✦ A LITTLE JOURNEY INTO YOUR MIND ✦</div>
  <h1>🌷 心理學探索島</h1>
  <p>走進一座溫柔的小島，探索知覺、注意力與決策的祕密。</p>
</header>

<div class="game-wrap">
  <canvas id="game" width="1000" height="650"></canvas>
  <div class="hint" id="hint">使用方向鍵或 WASD，開始探索小島 ♡</div>
</div>

<div class="instructions">
  🚶 使用 <strong>W A S D</strong> 或 <strong>方向鍵</strong>移動<br>
  🏡 走到小屋門口，按 <strong>E</strong> 進入
</div>

<div class="controls">
  <button class="up" data-key="ArrowUp">↑</button>
  <button class="left" data-key="ArrowLeft">←</button>
  <button class="down" data-key="ArrowDown">↓</button>
  <button class="right" data-key="ArrowRight">→</button>
</div>

<button class="enter-btn" id="enterBtn">🚪 進入小屋</button>

<h2>🏅 我的探索徽章</h2>
<p id="progress">已完成 0 / 3 個實驗</p>

<div class="badges">
  <div class="badge" id="badge-perception">👁️ 知覺觀察家</div>
  <div class="badge" id="badge-attention">🎯 注意力探索者</div>
  <div class="badge" id="badge-decision">💭 決策研究員</div>
</div>

<p id="allDone"></p>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalContent"></div>
  </div>
</div>

<footer>
  Psychology Island · 普通心理學互動式期末報告
</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const player = {
  x: 500,
  y: 570,
  speed: 3,
  direction: "down",
  step: 0
};

const keys = {};

const houses = [
  {
    id: "perception",
    name: "知覺小屋",
    x: 180,
    y: 180,
    color: "#e8a99d",
    doorX: 270,
    doorY: 360
  },
  {
    id: "attention",
    name: "注意力小屋",
    x: 650,
    y: 175,
    color: "#bca8d9",
    doorX: 740,
    doorY: 355
  },
  {
    id: "decision",
    name: "決策小屋",
    x: 410,
    y: 345,
    color: "#8fc5b8",
    doorX: 500,
    doorY: 525
  }
];

const completed = {
  perception: false,
  attention: false,
  decision: false
};

let nearbyHouse = null;
let modalOpen = false;

/* 畫圖工具 */

function ellipse(x, y, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function rect(x, y, w, h, color, radius = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fill();
}

function line(points, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);

  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i][0], points[i][1]);
  }

  ctx.stroke();
}

/* 畫森林 */

function drawTree(x, y, scale = 1) {
  ellipse(x, y + 25 * scale, 35 * scale, 12 * scale, "#679c7844");

  rect(
    x - 7 * scale,
    y,
    14 * scale,
    40 * scale,
    "#a67d63",
    4
  );

  ellipse(x, y - 20 * scale, 34 * scale, 33 * scale, "#6fa881");
  ellipse(x - 17 * scale, y - 30 * scale, 23 * scale, 25 * scale, "#91c69a");
  ellipse(x + 14 * scale, y - 35 * scale, 23 * scale, 24 * scale, "#83bb8c");
}

function drawFlower(x, y, color) {
  ellipse(x, y, 5, 5, color);
  ellipse(x - 6, y, 5, 5, color);
  ellipse(x + 6, y, 5, 5, color);
  ellipse(x, y - 6, 5, 5, color);
  ellipse(x, y + 6, 5, 5, color);
  ellipse(x, y, 3, 3, "#f8e4a5");
}

/* 畫小屋 */

function drawHouse(h) {
  const x = h.x;
  const y = h.y;

  ellipse(x + 90, y + 175, 105, 20, "#6b8d6c55");

  rect(x, y + 55, 180, 135, "#fff1df", 10);

  ctx.fillStyle = h.color;
  ctx.beginPath();
  ctx.moveTo(x - 20, y + 65);
  ctx.lineTo(x + 90, y - 45);
  ctx.lineTo(x + 200, y + 65);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff55";
  ctx.beginPath();
  ctx.moveTo(x + 5, y + 57);
  ctx.lineTo(x + 90, y - 25);
  ctx.lineTo(x + 175, y + 57);
  ctx.closePath();
  ctx.fill();

  rect(x + 25, y + 90, 38, 38, "#b9dfe1", 5);
  rect(x + 117, y + 90, 38, 38, "#b9dfe1", 5);

  rect(x + 76, y + 130, 28, 60, "#a77d69", 4);

  ctx.fillStyle = "#fff6e9";
  ctx.font = "bold 20px PingFang TC";
  ctx.textAlign = "center";
  ctx.strokeStyle = "#6c6459";
  ctx.lineWidth = 5;
  ctx.strokeText(h.name, x + 90, y + 220);
  ctx.fillText(h.name, x + 90, y + 220);
}

/* 畫小島 */

function drawMap() {
  ctx.clearRect(0, 0, W, H);

  rect(0, 0, W, H, "#c7e6e5");

  // 海水紋理
  for (let i = 0; i < 18; i++) {
    const x = (i * 137 + 40) % W;
    const y = (i * 83 + 35) % H;
    line([[x, y], [x + 25, y - 3]], "#ffffff88", 3);
  }

  // 島嶼
  ellipse(500, 375, 425, 265, "#c89d7b");
  ellipse(500, 355, 420, 255, "#a9d2a1");

  // 草地區塊
  ellipse(300, 420, 150, 80, "#9acb96");
  ellipse(750, 425, 130, 70, "#9acb96");
  ellipse(500, 170, 160, 50, "#9acb96");

  // 小路
  line(
    [[500, 590], [500, 515], [500, 455], [500, 380], [500, 280]],
    "#f4dfba",
    65
  );

  line(
    [[500, 380], [400, 350], [270, 350]],
    "#f4dfba",
    45
  );

  line(
    [[500, 380], [610, 350], [740, 350]],
    "#f4dfba",
    45
  );

  // 池塘
  ellipse(785, 490, 72, 36, "#77c1c6");
  ellipse(785, 484, 54, 23, "#a8e0df");

  // 遠處樹林
  [
    [180, 270, 1.1],
    [130, 390, .9],
    [240, 480, .9],
    [345, 180, .85],
    [500, 145, 1],
    [620, 180, .9],
    [855, 275, 1.1],
    [870, 390, .9],
    [675, 495, .85]
  ].forEach(t => drawTree(...t));

  // 花朵
  const flowers = [
    [330, 460, "#f2b5b5"],
    [350, 485, "#f6df9f"],
    [620, 455, "#f2b5b5"],
    [650, 470, "#f6df9f"],
    [395, 190, "#e6b8da"],
    [600, 210, "#f2b5b5"],
    [280, 525, "#f6df9f"],
    [730, 540, "#f2b5b5"]
  ];

  flowers.forEach(f => drawFlower(...f));

  houses.forEach(drawHouse);
}

/* 畫小人物 */

function drawPlayer() {
  const x = player.x;
  const y = player.y;
  const bounce = Math.sin(player.step) * 2;

  ellipse(x, y + 9, 17, 7, "#56745d55");

  // 腿
  rect(x - 10, y - 6, 8, 20, "#786d82", 3);
  rect(x + 2, y - 6, 8, 20, "#786d82", 3);

  // 衣服
  ellipse(x, y - 15 + bounce, 18, 22, "#e5a9a6");

  // 頭
  ellipse(x, y - 42 + bounce, 17, 18, "#f5d7bc");

  // 頭髮
  ellipse(x, y - 53 + bounce, 18, 10, "#6e5148");

  if (player.direction !== "up") {
    ellipse(x - 6, y - 41 + bounce, 2, 2, "#594a45");
    ellipse(x + 6, y - 41 + bounce, 2, 2, "#594a45");
  }
}

/* 遊戲更新 */

function update() {
  if (modalOpen) return;

  let dx = 0;
  let dy = 0;

  if (keys.ArrowUp || keys.w) {
    dy -= 1;
    player.direction = "up";
  }

  if (keys.ArrowDown || keys.s) {
    dy += 1;
    player.direction = "down";
  }

  if (keys.ArrowLeft || keys.a) {
    dx -= 1;
    player.direction = "left";
  }

  if (keys.ArrowRight || keys.d) {
    dx += 1;
    player.direction = "right";
  }

  if (dx || dy) {
    const length = Math.hypot(dx, dy);

    player.x += dx / length * player.speed;
    player.y += dy / length * player.speed;

    player.step += .25;
  }

  // 避免走出小島
  const nx = (player.x - 500) / 390;
  const ny = (player.y - 355) / 225;

  if (nx * nx + ny * ny > 1) {
    player.x -= dx / (Math.hypot(dx, dy) || 1) * player.speed;
    player.y -= dy / (Math.hypot(dx, dy) || 1) * player.speed;
  }

  nearbyHouse = null;

  for (const h of houses) {
    const distance = Math.hypot(
      player.x - h.doorX,
      player.y - h.doorY
    );

    if (distance < 75) {
      nearbyHouse = h;
      break;
    }
  }

  const hint = document.getElementById("hint");

  hint.textContent = nearbyHouse
    ? `🏡 ${nearbyHouse.name}｜按 E 進入`
    : "使用方向鍵或 WASD，探索小島 ♡";
}

function gameLoop() {
  update();
  drawMap();
  drawPlayer();
  requestAnimationFrame(gameLoop);
}

gameLoop();

/* 鍵盤操作 */

window.addEventListener("keydown", e => {
  const key = e.key.length === 1
    ? e.key.toLowerCase()
    : e.key;

  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(key)) {
    e.preventDefault();
  }

  keys[key] = true;

  if (key === "e" && nearbyHouse && !modalOpen) {
    openHouse(nearbyHouse.id);
  }
});

window.addEventListener("keyup", e => {
  const key = e.key.length === 1
    ? e.key.toLowerCase()
    : e.key;

  keys[key] = false;
});

window.addEventListener("blur", () => {
  Object.keys(keys).forEach(key => keys[key] = false);
});

/* 手機方向按鈕 */

document.querySelectorAll("[data-key]").forEach(button => {
  const key = button.dataset.key;

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    keys[key] = true;
  });

  button.addEventListener("pointerup", () => {
    keys[key] = false;
  });

  button.addEventListener("pointercancel", () => {
    keys[key] = false;
  });
});

document.getElementById("enterBtn").onclick = () => {
  if (nearbyHouse) openHouse(nearbyHouse.id);
};

/* 小屋互動 */

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");

function openHouse(id) {
  modalOpen = true;
  modal.classList.add("active");

  if (id === "perception") showPerception();
  if (id === "attention") showAttention();
  if (id === "decision") showDecision();
}

function closeModal() {
  modalOpen = false;
  modal.classList.remove("active");
  Object.keys(keys).forEach(key => keys[key] = false);
}

function finish(id) {
  completed[id] = true;

  document.getElementById("badge-" + id)
    .classList.add("done");

  const count = Object.values(completed)
    .filter(Boolean).length;

  document.getElementById("progress").textContent =
    `已完成 ${count} / 3 個實驗`;

  if (count === 3) {
    document.getElementById("allDone").textContent =
      "🎉 恭喜！你已經完成整座心理學探索島！";
  }

  closeModal();
}

/* 實驗一：知覺 */

function showPerception() {
  modalTitle.textContent = "👁️ 知覺小屋";

  modalContent.innerHTML = `
    <p>請觀察下面兩條水平線，你覺得哪一條比較長？</p>

    <svg viewBox="0 0 450 200" style="width:100%;max-width:450px">
      <g stroke="#66554e" stroke-width="6" fill="none">
        <path d="M120 50 H330"/>
        <path d="M120 50 L150 20 M120 50 L150 80"/>
        <path d="M330 50 L300 20 M330 50 L300 80"/>

        <path d="M120 145 H330"/>
        <path d="M120 145 L90 115 M120 145 L90 175"/>
        <path d="M330 145 L360 115 M330 145 L360 175"/>
      </g>
      <text x="50" y="55">A</text>
      <text x="50" y="150">B</text>
    </svg>

    <div>
      <button class="choice" onclick="answerPerception('A')">A 比較長</button>
      <button class="choice" onclick="answerPerception('B')">B 比較長</button>
      <button class="choice" onclick="answerPerception('一樣長')">一樣長</button>
    </div>

    <div id="result"></div>
  `;
}

function answerPerception(answer) {
  document.getElementById("result").innerHTML = `
    <div class="result">
      <h3>✨ 答案揭曉</h3>
      <p>你的選擇：${answer}</p>
      <p><strong>其實兩條水平線一樣長！</strong></p>
      <p>
        這是 Müller-Lyer illusion（穆勒－萊爾錯覺）。
        線段兩端的箭頭方向，會影響我們對長度的知覺。
      </p>
      <p>大腦對世界的理解，不一定等於刺激本身的物理特性。</p>
      <button class="primary" onclick="finish('perception')">
        獲得知覺徽章 ✓
      </button>
    </div>
  `;
}

/* 實驗二：注意力 */

const colors = [
  {name:"紅色", code:"#d75e65"},
  {name:"藍色", code:"#528bc7"},
  {name:"綠色", code:"#4b9b70"},
  {name:"紫色", code:"#9568b8"}
];

let round = 0;
let correct = 0;
let target = "";
let startTime = 0;

function showAttention() {
  modalTitle.textContent = "🎯 注意力小屋";

  modalContent.innerHTML = `
    <p>
      歡迎來到 Stroop 挑戰！<br>
      請忽略文字的意思，只選擇<strong>字體顯示的顏色</strong>。
    </p>
    <button class="primary" onclick="startStroop()">開始挑戰</button>
    <div id="stroopArea"></div>
  `;
}

function startStroop() {
  round = 0;
  correct = 0;
  startTime = performance.now();
  nextStroop();
}

function nextStroop() {
  const area = document.getElementById("stroopArea");

  if (round >= 6) {
    const seconds = ((performance.now() - startTime) / 1000).toFixed(1);

    area.innerHTML = `
      <div class="result">
        <h3>🎉 挑戰完成！</h3>
        <p>答對 ${correct} / 6 題</p>
        <p>花費 ${seconds} 秒</p>
        <p>
          Stroop 效應是指文字語意與字體顏色不一致時，
          可能干擾人們辨認顏色的速度與正確率。
        </p>
        <p>
          這是簡化版體驗；正式研究通常需要比較
          一致與不一致條件的反應時間。
        </p>
        <button class="primary" onclick="finish('attention')">
          獲得注意力徽章 ✓
        </button>
      </div>
    `;
    return;
  }

  const colorIndex = Math.floor(Math.random() * colors.length);
  let wordIndex = Math.floor(Math.random() * colors.length);

  if (wordIndex === colorIndex) {
    wordIndex = (wordIndex + 1) % colors.length;
  }

  target = colors[colorIndex].name;

  area.innerHTML = `
    <p>第 ${round + 1} / 6 題</p>
    <div style="
      font-size:45px;
      font-weight:bold;
      color:${colors[colorIndex].code};
      margin:20px;
    ">
      ${colors[wordIndex].name}
    </div>

    ${colors.map(c => `
      <button class="choice" onclick="answerStroop('${c.name}')">
        ${c.name}
      </button>
    `).join("")}
  `;
}

function answerStroop(answer) {
  if (answer === target) correct++;
  round++;
  nextStroop();
}

/* 實驗三：決策 */

let decisionAnswers = [];

function showDecision() {
  modalTitle.textContent = "💭 決策小屋";
  decisionAnswers = [];

  modalContent.innerHTML = `
    <p>
      假設有 600 人受到一種疾病威脅。<br>
      請根據你的直覺，選擇你偏好的方案。
    </p>
    <div id="decisionArea"></div>
  `;

  decisionStep(0);
}

function decisionStep(step) {
  const area = document.getElementById("decisionArea");

  if (step === 0) {
    area.innerHTML = `
      <h3>第一輪：存活框架</h3>
      <button class="choice" onclick="answerDecision(0,0)">
        A：確定有 200 人存活
      </button>
      <button class="choice" onclick="answerDecision(0,1)">
        B：1/3 機率全部存活，2/3 機率無人存活
      </button>
    `;
  } else {
    area.innerHTML = `
      <h3>第二輪：死亡框架</h3>
      <button class="choice" onclick="answerDecision(1,0)">
        C：確定有 400 人死亡
      </button>
      <button class="choice" onclick="answerDecision(1,1)">
        D：1/3 機率無人死亡，2/3 機率全部死亡
      </button>
    `;
  }
}

function answerDecision(step, choice) {
  decisionAnswers.push(choice);

  if (step === 0) {
    decisionStep(1);
    return;
  }

  const changed = decisionAnswers[0] !== decisionAnswers[1];

  document.getElementById("decisionArea").innerHTML = `
    <div class="result">
      <h3>🧠 選擇結果</h3>
      <p>
        你在兩輪中${changed ? "改變了" : "維持了"}相同的風險偏好。
      </p>
      <p>
        A 與 C 的結果相同，B 與 D 的結果也相同。
        差別在於描述方式：一組強調存活，另一組強調死亡。
      </p>
      <p>
        這就是框架效應（Framing Effect）的經典示範：
        相同資訊可能因為表述方式不同，而影響決策。
      </p>
      <p>
        單次作答無法證明個人一定受到框架效應影響。
      </p>
      <button class="primary" onclick="finish('decision')">
        獲得決策徽章 ✓
      </button>
    </div>
  `;
}
